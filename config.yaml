server:
  port: 3000
  allow_local_login: true

database:
  path: /data/altsearch.db

openrouter_presets:
  fast:
    model: "deepseek/deepseek-v4-flash"
    label: "Fast"
    description: "~$0.40 / 1M tokens"
    temperature: 0.7
    reasoning: "low"
  balanced:
    model: "deepseek/deepseek-v4-pro"
    label: "Balanced"
    description: "Bla bla"
    temperature: 0.7
    reasoning: "high"
  reasoning:
    model: "google/gemini-3.1-pro-preview"
    label: "Reasoning"
    description: "Complex logic and careful edits"
    temperature: 0.7
    reasoning: "high"
openrouter_default_preset: "balanced"

images:
  enabled: true
  model: google/gemini-3.1-flash-image-preview
  aspect_ratio: "4:3"

embeddings:
  enabled: true
  local: true
  model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2

reddit:
  post_count: 5
